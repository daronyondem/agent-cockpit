name: Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  copilot-sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix "${{ runner.temp }}/copilot-sdk-cli" --no-save @github/copilot@1.0.105
      - run: npm run e2e:copilot-sdk
        env:
          COPILOT_SDK_CLI_PATH: ${{ runner.temp }}/copilot-sdk-cli/node_modules/@github/copilot/npm-loader.js
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: copilot-sdk-${{ matrix.os }}
          path: ${{ runner.temp }}/copilot-sdk-compat-*/

  copilot-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix mobile/AgentCockpitPWA ci
      - run: npm install --prefix "$RUNNER_TEMP/copilot-cli" --no-save @github/copilot@1.0.105
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:copilot-ui
        env:
          COPILOT_UI_CLI: ${{ runner.temp }}/copilot-cli/node_modules/.bin/copilot
          PLAYWRIGHT_USE_SYSTEM_CHROME: '0'
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: copilot-browser-evidence
          path: |
            test-results/
            ${{ runner.temp }}/cockpit-copilot-ui-*/compatibility-report.json
            ${{ runner.temp }}/cockpit-copilot-ui-*/server-out.log
            ${{ runner.temp }}/cockpit-copilot-ui-*/server-error.log

  copilot-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- test/copilotWindowsProcess.test.ts --runInBand

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix mobile/AgentCockpitPWA ci
      - run: npm run typecheck
      - run: npm run web:typecheck
      - run: npm run web:build
      - run: npm run web:budget
      - run: npm run mobile:typecheck
      - run: npm run lint
      - run: npm run maintainability:check
      - run: npm run spec:drift
      - run: npm run mobile:build
      - run: npm test
      - run: npm run adr:lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix mobile/AgentCockpitPWA ci
      - run: npm run test:coverage
