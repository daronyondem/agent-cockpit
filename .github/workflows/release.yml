name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to publish, without or with a leading v.
        required: true
        type: string
      source_ref:
        description: Branch, tag, or commit to package.
        required: true
        default: main
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease.
        required: true
        default: false
        type: boolean
      smoke_only:
        description: Validate the production candidate without publishing it.
        required: true
        default: false
        type: boolean

jobs:
  candidate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Normalize release inputs
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${REQUESTED_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          CURRENT="$(node -p "require('./package.json').version")"
          if [ "$CURRENT" != "$VERSION" ]; then npm version "$VERSION" --no-git-tag-version; fi
      - run: npm ci
      - run: npm --prefix mobile/AgentCockpitPWA ci
      - run: npm run typecheck
      - run: npm run web:typecheck
      - run: npm run web:build
      - run: npm run web:budget
      - run: npm run mobile:typecheck
      - run: npm run lint
      - run: npm run maintainability:check
      - run: npm run spec:drift
      - run: npm run mobile:build
      - run: npm test
      - run: npm run adr:lint
      - name: Package release candidate
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          npm run release:package -- \
            --version "${{ steps.release.outputs.version }}" \
            --source-ref "$SOURCE_REF" \
            --commit "${{ steps.release.outputs.commit }}" \
            --out-dir dist/release
      - name: Render release notes
        if: ${{ !inputs.smoke_only }}
        run: |
          npm run release:notes -- \
            --version "${{ steps.release.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --out dist/release/github-release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/release

  platform-smoke:
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
    with:
      source_ref: ${{ needs.candidate.outputs.commit }}
      artifact_name: release-candidate
      full_matrix: true

  release:
    needs: [candidate, platform-smoke]
    if: ${{ !inputs.smoke_only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/release
      - name: Publish tested release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
          COMMIT: ${{ needs.candidate.outputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          PRERELEASE_ARGS=()
          if [ "$PRERELEASE" = true ]; then PRERELEASE_ARGS=(--prerelease); fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "Agent Cockpit v$VERSION" \
            --notes-file dist/release/github-release-notes.md \
            "${PRERELEASE_ARGS[@]}" \
            "dist/release/agent-cockpit-v$VERSION.tar.gz" \
            "dist/release/agent-cockpit-v$VERSION.zip" \
            dist/release/release-manifest.json \
            dist/release/SHA256SUMS \
            dist/release/install-macos.sh \
            dist/release/install-linux.sh \
            dist/release/install-windows.ps1
